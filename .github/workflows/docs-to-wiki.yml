name: Sync docs to Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  convert-frontmatter:
    name: Convert YAML frontmatter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install gray-matter

      - name: Convert frontmatter
        run: node scripts/convert-frontmatter.js

      - name: Upload converted documentation
        uses: actions/upload-artifact@v6
        with:
          name: converted-docs
          path: |
            docs/
            README.md
            .git/
          include-hidden-files: true

  sync-wiki:
    name: Sync docs to Wiki
    runs-on: ubuntu-latest
    needs: convert-frontmatter

    steps:
      - name: Download converted documentation
        uses: actions/download-artifact@v7
        with:
          name: converted-docs
          path: .

      - name: Run github-docs-to-wiki
        uses: jost1x/github-docs-to-wiki@master
        with:
          githubToken: ${{ secrets.WIKI_PAT }}
          defaultBranch: main
          rootDocsFolder: docs
          convertRootReadmeToHomePage: true
          customCommitMessageFormat: 'Sync docs from {shaShort}: {commitMessage}'