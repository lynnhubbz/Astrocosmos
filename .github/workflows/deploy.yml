name: Deploy Quartz site to GitHub Pages
 
on:
  push:
    branches:
      - quartz-test
      - main
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: "pages"
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
          # Step 1: Checkout the Quartz site repository/branch
          - uses: actions/checkout@v6

          # Step 2: Pull the content tree from the main branch into a temporary folder
          # lorem ipsum
          - name: Checkout content from main branch
            uses: actions/checkout@v6
            with:
              ref: main
              path: main-branch
              fetch-depth: 0

          - name: Prepare content directory
            run: |
              rm -rf content
              mkdir -p content
              if [ -d main-branch/content ]; then
                cp -a main-branch/content/. content/
              else
                cp -a main-branch/. content/
              fi
              rm -rf main-branch

          - uses: actions/setup-node@v6
            with:
              node-version: 24

          - name: Cache dependencies
            uses: actions/cache@v5
            with:
              path: ~/.npm
              key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
              restore-keys: |
                ${{ runner.os }}-node-

          - name: Cache Quartz plugins
            uses: actions/cache@v5
            with:
              path: .quartz/plugins
              key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
              restore-keys: |
                ${{ runner.os }}-plugins-

          - name: Install Dependencies
            run: npm ci

          - name: Install Quartz plugins
            run: npm run quartz -- plugin install --latest

          - name: Build Quartz
            run: npm run quartz -- build

          - name: Upload artifact
            uses: actions/upload-pages-artifact@v3
            with:
              path: public
 
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5